<svg width="100%" viewBox="0 0 680 790" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Job Buddy target architecture</title>
  <desc>Target package roles and dependencies, plus local Pi SDK and remote cloud runtime paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="52" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Job Buddy 目标架构</text>
  <text x="52" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">先定清包边界，功能按阶段接入</text>

  <rect x="40" y="65" width="600" height="405" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="62" y="87" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" dominant-baseline="central">一、包的职责和依赖</text>
  <text x="62" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#888780" dominant-baseline="central">现有：desktop / web / ui / client；client 整理为 contracts，其余按阶段新增</text>

  <rect x="60" y="119" width="270" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="76" y="137" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">@job-buddy/desktop</text>
  <text x="76" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#185FA5" dominant-baseline="central">Electron、IPC、组合本地或云端实现</text>
  <text x="76" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 ui · contracts · agent-runtime · agent-pi · remote</text>

  <rect x="350" y="119" width="270" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="366" y="137" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">@job-buddy/web</text>
  <text x="366" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#185FA5" dominant-baseline="central">浏览器入口，只连接云端 Agent</text>
  <text x="366" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 ui · contracts · agent-runtime · remote</text>

  <rect x="60" y="201" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="219" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/ui</text>
  <text x="76" y="237" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">React 页面、组件、主题</text>
  <text x="76" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 contracts；不直接碰 Pi SDK 或云端</text>

  <rect x="350" y="201" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="219" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/contracts</text>
  <text x="366" y="237" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">唯一公共接口和共享数据类型</text>
  <text x="366" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">把 client 与 UI 里的宿主接口集中到这里</text>

  <rect x="60" y="283" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/domain</text>
  <text x="76" y="319" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">项目、会话、任务的业务规则</text>
  <text x="76" y="338" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">不依赖 Electron、React 或网络</text>

  <rect x="350" y="283" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/agent-runtime</text>
  <text x="366" y="319" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">统一管理任务、取消、状态和事件</text>
  <text x="366" y="338" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 contracts · domain；宿主负责组装实现</text>

  <rect x="60" y="365" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="383" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/agent-pi</text>
  <text x="76" y="401" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">本地 Agent 实现，调用 Pi SDK</text>
  <text x="76" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 contracts · Pi SDK</text>

  <rect x="350" y="365" width="270" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="383" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@job-buddy/remote</text>
  <text x="366" y="401" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">云端 Agent 实现，负责网络连接</text>
  <text x="366" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">依赖 contracts · HTTP/WebSocket</text>

  <rect x="40" y="490" width="600" height="264" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="62" y="513" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" dominant-baseline="central">二、运行时调用路径</text>
  <text x="62" y="531" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#888780" dominant-baseline="central">这里只画调用顺序；本地和云端使用同一套 Agent 接口</text>

  <text x="62" y="561" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">桌面本地</text>
  <rect x="150" y="543" width="55" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="177.5" y="561" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UI</text>
  <rect x="220" y="543" width="82" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="261" y="561" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">IPC</text>
  <rect x="317" y="543" width="115" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="374.5" y="561" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-runtime</text>
  <rect x="447" y="543" width="78" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="486" y="561" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-pi</text>
  <rect x="540" y="543" width="82" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="581" y="561" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Pi SDK</text>
  <path d="M205 561L220 561M302 561L317 561M432 561L447 561M525 561L540 561" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>

  <text x="62" y="619" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">桌面 / Web 云端</text>
  <rect x="150" y="601" width="55" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="177.5" y="619" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UI</text>
  <rect x="220" y="601" width="82" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="261" y="619" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">IPC / Web</text>
  <rect x="317" y="601" width="115" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="374.5" y="619" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-runtime</text>
  <rect x="447" y="601" width="78" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="486" y="619" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">remote</text>
  <rect x="540" y="601" width="82" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="581" y="619" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">云端 Agent</text>
  <path d="M205 619L220 619M302 619L317 619M432 619L447 619M525 619L540 619" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>

  <text x="62" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">RPC 暂不单独建包：桌面用 IPC，云端用 HTTP/WebSocket。</text>
</svg>
