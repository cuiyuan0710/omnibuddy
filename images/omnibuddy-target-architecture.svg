<svg width="100%" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>OmniBuddy 目标架构</title>
  <desc>八个目标包的职责、依赖和本地 Pi 与云端 Agent 的运行路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="52" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#2C2C2A" dominant-baseline="central">OmniBuddy 目标架构</text>
  <text x="52" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">先定清包边界，功能按阶段接入</text>

  <rect x="40" y="70" width="600" height="380" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="62" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" dominant-baseline="central">一、包的职责和依赖</text>
  <text x="380" y="92" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#888780" dominant-baseline="central">实线=依赖；虚线=实现接口</text>
  <text x="62" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#888780" dominant-baseline="central">保留 desktop / web / ui；client 归到 contracts；其余建议新增</text>

  <path d="M195 196L195 205" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
  <path d="M350 196L340 196L340 238L330 238" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
  <path d="M330 238L350 238" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
  <path d="M350 313L330 313" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
  <path d="M485 280L485 271" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
  <path d="M330 388L340 388L340 260L350 260" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M485 355L630 355L630 260L620 260" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="60" y="126" width="270" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="76" y="143" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">@omnibuddy/desktop</text>
  <text x="76" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#185FA5" dominant-baseline="central">Electron 主进程、IPC；选择本地或云端</text>
  <text x="76" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">使用 ui / runtime / contracts / 两种适配器</text>

  <rect x="350" y="126" width="270" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="366" y="143" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">@omnibuddy/web</text>
  <text x="366" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#185FA5" dominant-baseline="central">浏览器入口，通过云端使用 Agent</text>
  <text x="366" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">使用 ui / runtime / contracts / remote</text>

  <rect x="60" y="205" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="223" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/ui</text>
  <text x="76" y="247" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">React 页面、组件、主题；依赖 contracts</text>

  <rect x="350" y="205" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="223" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/contracts</text>
  <text x="366" y="247" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">唯一共享接口/数据；整合 client 和 UI 契约</text>

  <rect x="60" y="280" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/domain</text>
  <text x="76" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">项目、会话、任务规则；不依赖宿主</text>

  <rect x="350" y="280" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/agent-runtime</text>
  <text x="366" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">统一任务流程；依赖 contracts 和 domain</text>

  <rect x="60" y="355" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="373" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/agent-pi</text>
  <text x="76" y="397" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">本地适配器；实现 contracts 接口，调用 Pi SDK</text>

  <rect x="350" y="355" width="270" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="373" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">@omnibuddy/remote</text>
  <text x="366" y="397" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0F6E56" dominant-baseline="central">云端适配器；实现 contracts 接口并连接云端</text>

  <rect x="40" y="465" width="600" height="280" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="62" y="488" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#5F5E5A" dominant-baseline="central">二、实际运行路径</text>
  <text x="62" y="508" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#888780" dominant-baseline="central">同一套 Agent 接口；宿主按模式选择本地或云端</text>

  <text x="62" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">桌面本地</text>
  <rect x="150" y="536" width="50" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="175" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UI</text>
  <rect x="209" y="536" width="74" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="246" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">IPC</text>
  <rect x="292" y="536" width="108" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="346" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-runtime</text>
  <rect x="409" y="536" width="76" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="447" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-pi</text>
  <rect x="494" y="536" width="100" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="544" y="554" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Pi SDK</text>
  <path d="M200 554L209 554M283 554L292 554M400 554L409 554M485 554L494 554" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>

  <text x="62" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">桌面云端</text>
  <rect x="150" y="596" width="50" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="175" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UI</text>
  <rect x="209" y="596" width="74" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="246" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">IPC</text>
  <rect x="292" y="596" width="108" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="346" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-runtime</text>
  <rect x="409" y="596" width="76" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="447" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">remote</text>
  <rect x="494" y="596" width="100" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="544" y="614" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">云端 Agent</text>
  <path d="M200 614L209 614M283 614L292 614M400 614L409 614M485 614L494 614" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>

  <text x="62" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">Web 云端</text>
  <rect x="150" y="656" width="50" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="175" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UI</text>
  <rect x="209" y="656" width="74" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="246" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Web</text>
  <rect x="292" y="656" width="108" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="346" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-runtime</text>
  <rect x="409" y="656" width="76" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="447" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">remote</text>
  <rect x="494" y="656" width="100" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="544" y="674" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">云端 Agent</text>
  <path d="M200 674L209 674M283 674L292 674M400 674L409 674M485 674L494 674" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>

  <text x="62" y="724" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">RPC 不单独建包：桌面 IPC；云端 HTTP / WebSocket。</text>
</svg>
