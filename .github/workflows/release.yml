name: Release desktop

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun run scripts/validate-release-tag.ts "$GITHUB_REF_NAME"

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun --filter @omnibuddy/desktop package:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            packages/desktop/release/out/*.exe
            packages/desktop/release/out/*.blockmap
            packages/desktop/release/out/latest.yml
          if-no-files-found: error

  build-macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun --filter @omnibuddy/desktop package:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            packages/desktop/release/out/*.dmg
            packages/desktop/release/out/*.zip
          if-no-files-found: error

  build-linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun --filter @omnibuddy/desktop package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            packages/desktop/release/out/*.AppImage
            packages/desktop/release/out/*.deb
            packages/desktop/release/out/*.blockmap
            packages/desktop/release/out/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [validate, build-windows, build-macos, build-linux]
    if: ${{ always() && needs.validate.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Create draft, upload every artifact, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for pattern in \
            "OmniBuddy-*-win-x64.exe" \
            "OmniBuddy-*-mac-arm64.dmg" \
            "OmniBuddy-*-mac-arm64.zip" \
            "OmniBuddy-*-mac-x64.dmg" \
            "OmniBuddy-*-mac-x64.zip" \
            "OmniBuddy-*-linux-x86_64.AppImage" \
            "OmniBuddy-*-linux-amd64.deb" \
            "latest.yml" \
            "latest-linux.yml"; do
            compgen -G "release-assets/$pattern" >/dev/null || {
              echo "Missing expected release artifact: $pattern" >&2
              exit 1
            }
          done
          PUBLISHED_RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id" \
            | sed -n '1p')
          if [[ -n "$PUBLISHED_RELEASE_ID" ]]; then
            echo "Refusing to replace an already-published release for $TAG" >&2
            exit 1
          fi

          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --jq ".[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"OmniBuddy $TAG\")) | .id" \
            | sed -n '1p')
          if [[ -z "$RELEASE_ID" ]]; then
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$TAG" \
              -f "target_commitish=$GITHUB_SHA" \
              -f "name=OmniBuddy $TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '.id')
          fi

          for file in release-assets/*; do
            asset_name="${file##*/}"
            existing_asset_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --paginate \
              --jq ".[] | select(.name == \"$asset_name\") | .id")
            while IFS= read -r asset_id; do
              [[ -z "$asset_id" ]] || gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
            done <<< "$existing_asset_ids"

            curl --fail-with-body --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset_name" \
              >/dev/null
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            --jq '.html_url'
